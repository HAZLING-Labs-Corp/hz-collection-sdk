// Compilación del plugin nativo. Lo mínimo: no agrega dependencias al APK, no declara permisos.
group 'com.hazling.collection'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects { repositories { google(); mavenCentral() } }

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hazling.collection'
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
    defaultConfig { minSdk 21 }
}

dependencies {
    // 🔴 compileOnly: el reconocimiento de actividad del rastreo usa Play Services Location,
    // que YA va en el APK por geolocator_android (dependencia firme del SDK). No se empaqueta
    // de nuevo ni se agrega nada: sólo se compila contra ella. Ver RastreoNativo.kt.
    compileOnly 'com.google.android.gms:play-services-location:21.2.0'
}
